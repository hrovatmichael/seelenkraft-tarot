<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e0a16"><title>Seelenkraft · Administration</title><style>
:root{--bg:#0e0a16;--panel:#ffffff0b;--gold:#ead09e;--text:#f6efe8;--muted:#cbbfce;--line:#e7c9894d;--violet:#bd94d2}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100svh;background:radial-gradient(ellipse 75% 35% at 50% -5%,#53375c,transparent 80%),radial-gradient(ellipse 55% 45% at 90% 90%,#32233e,transparent 80%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1120px;margin:auto;padding:22px 16px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:28px}.brand{color:var(--gold);letter-spacing:.22em;font-size:11px;font-weight:800}.nav{display:flex;flex-wrap:wrap;gap:8px}.nav a,.btn{border:1px solid #e4c98b6a;border-radius:99px;background:#ffffff0b;color:#f0dab0;padding:9px 14px;text-decoration:none;font:600 12px system-ui}.nav a.active{background:linear-gradient(120deg,#f4dca3,#bd94d2);color:#25172d}.hero{text-align:center;margin:34px auto}.hero h1{font:normal clamp(40px,7vw,72px)/1 Georgia,serif;color:#f7e4c5;margin:0}.hero p{max-width:700px;margin:18px auto;color:var(--muted);line-height:1.7}.panel{border:1px solid var(--line);background:var(--panel);border-radius:22px;box-shadow:0 16px 52px #0005;padding:clamp(18px,4vw,34px)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.portal-card{text-decoration:none;color:inherit;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;transition:.2s}.portal-card:hover{transform:translateY(-3px);border-color:#e8c98788}.portal-card .icon{font-size:38px}.portal-card h2,.panel h2{font:normal 30px Georgia,serif;color:#f1d9a7;margin:10px 0}.portal-card p,.panel p{color:var(--muted);line-height:1.6}.status{display:inline-flex;flex-direction:column;align-items:flex-end;border:1px solid #78be8755;border-radius:13px;padding:7px 12px;background:#78be8710;font-size:11px}.status strong{color:#bfe2c6}.status span{color:#bcaebe;margin-top:2px}.actions{display:flex;align-items:center;gap:8px}.error{color:#ffb7b5}.hidden{display:none!important}label{display:block;color:#e7d3b7;font-size:12px}input,select{width:100%;min-height:45px;margin-top:7px;border:1px solid #cba97c80;background:#0d0915;color:#fff;padding:11px 13px;border-radius:12px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.form-grid .wide{grid-column:1/-1}.cta{border:1px solid #f8dfa5;border-radius:99px;background:linear-gradient(120deg,#f4dca3,#bd94d2);color:#28192c;padding:12px 20px;font-weight:800}.user{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:12px;padding:16px;border:1px solid #ffffff17;border-radius:16px;background:#ffffff07}.badge{display:inline-block;margin-top:6px;padding:4px 9px;border-radius:99px;background:#78be8712;color:#bfe2c6;font-size:12px}.warn{background:#e6b95312;color:#f2d18d}.urgent{background:#ff777712;color:#ffaaa6}.user-buttons{display:flex;gap:8px}.user-buttons button{border:1px solid #d7bb8b80;border-radius:10px;background:#21152c;color:#f0d8ab;padding:9px}.moon{font-size:88px;text-align:center;margin:8px}.moon-grid{display:grid;grid-template-columns:.7fr 1.3fr;gap:18px}.reading{margin-top:25px}.questions{display:grid;gap:8px;margin:16px 0}.question{width:100%;text-align:left;border:1px solid #d7b78238;border-radius:12px;background:#0b0814;color:#eee4ed;padding:12px}.question.active{border-color:#efcf96;background:#d7ba8121}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}.card{text-align:center}.card img{width:100%;max-width:220px;aspect-ratio:825/1429;object-fit:cover;border:4px solid #caa56b;border-radius:10px}.interpretation{font:normal 17px/1.75 Georgia,serif;color:#e7dce5}.eyebrow{font-size:11px;letter-spacing:.16em;color:#e9c990;font-weight:700}@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.grid,.form-grid,.moon-grid{grid-template-columns:1fr}.cards{gap:7px}.card img{border-width:2px}.user{align-items:flex-start;flex-direction:column}.user-buttons{width:100%}.user-buttons button{flex:1}.status{align-items:flex-start}.actions{width:100%;justify-content:space-between}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">SEELENKRAFT · TAROT</div><nav class="nav"><a class="" href="/tarot.html">Tarot</a><a class="" href="/mondphase.html">Mondphase</a><a class="" href="/profil.html">Mein Zugang</a><a class="active" href="/admin.html">Admin</a></nav><div class="actions"><div id="access" class="status"><strong>Zugang</strong><span>Wird geladen</span></div><button class="btn" onclick="logout()">Abmelden</button></div></header><section class="hero"><div class="eyebrow">ADMINISTRATION</div><h1>Mitglieder verwalten.</h1><p>Neue Zugänge anlegen, Laufzeiten prüfen, Passwörter zurücksetzen und Mitglieder entfernen.</p></section><section class="panel"><div class="grid"><div><div class="eyebrow">AKTIVE MITGLIEDER</div><h2 id="active">0</h2></div><div><div class="eyebrow">LAUFEN BALD AB</div><h2 id="soon">0</h2></div></div><form id="create" class="form-grid"><label>Benutzername<input name="username" required minlength="3"></label><label>Passwort<input name="password" type="password" required minlength="10"></label><label>Zugangsdauer<select name="duration_type"><option value="7">7 Tage</option><option value="30" selected>30 Tage</option><option value="90">90 Tage</option><option value="180">180 Tage</option><option value="365">1 Jahr</option><option value="unlimited">Unbegrenzt</option><option value="custom">Individuelles Datum</option></select></label><label id="custom" class="hidden">Gültig bis<input name="expires_date" type="date"></label><button class="cta wide" type="submit">Nutzer speichern</button></form><p id="status"></p><label>Mitglieder durchsuchen<input id="search" type="search"></label><div id="users"></div></section></main><script>'use strict';
const api=async(path,options={})=>{const r=await fetch('/api/'+path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},cache:'no-store',...options});const v=await r.json().catch(()=>({error:'Antwort konnte nicht gelesen werden.'}));if(!r.ok)throw Error(v.error||'Anfrage fehlgeschlagen.');return v};
function expiryInfo(value){if(!value)return{label:'Unbegrenzt',date:'Kein Ablaufdatum',days:null};const n=Number(value),days=Math.max(0,Math.ceil((n-Date.now())/86400000));return{label:days===0?'Läuft heute ab':'Noch '+days+(days===1?' Tag':' Tage'),date:'Gültig bis '+new Date(n).toLocaleDateString('de-AT'),days}}
async function requireLogin(adminOnly=false){const me=await api('me');if(!me.authenticated){location.href='/';throw Error('Nicht angemeldet')}if(adminOnly&&me.role!=='admin'){location.href='/profil.html';throw Error('Keine Administratorrechte')}return me}
async function logout(){try{await api('logout',{method:'POST',body:'{}'})}finally{location.href='/'}}
let users=[];function render(){const term=document.getElementById('search').value.toLowerCase(),box=document.getElementById('users');box.innerHTML='';users.filter(u=>u.username.toLowerCase().includes(term)).forEach(u=>{const x=expiryInfo(u.expires_at),row=document.createElement('div');row.className='user';row.innerHTML='<div><strong>'+u.username+'</strong><div class="badge '+(x.days!==null&&x.days<=7?'urgent':x.days!==null&&x.days<=30?'warn':'')+'">'+x.label+'</div><div>'+x.date+'</div></div>';const a=document.createElement('div');a.className='user-buttons';const p=document.createElement('button');p.textContent='Passwort ändern';p.disabled=u.username==='admin';p.onclick=async()=>{const v=prompt('Neues Passwort, mindestens 10 Zeichen:');if(v===null)return;try{await api('admin/users',{method:'PUT',body:JSON.stringify({username:u.username,password:v})});document.getElementById('status').textContent='Passwort geändert.'}catch(e){document.getElementById('status').textContent=e.message}};const d=document.createElement('button');d.textContent='Löschen';d.disabled=u.username==='admin';d.onclick=async()=>{if(!confirm('Zugang löschen?'))return;await api('admin/users',{method:'DELETE',body:JSON.stringify({username:u.username})});await load()};a.append(p,d);row.append(a);box.append(row)})}async function load(){const d=await api('admin/users');users=d.users||[];const m=users.filter(u=>u.username!=='admin');document.getElementById('active').textContent=m.length;document.getElementById('soon').textContent=m.filter(u=>{const x=expiryInfo(u.expires_at).days;return x!==null&&x<=30}).length;render()}(async()=>{await requireLogin(true);const member=await api('member');document.getElementById('access').innerHTML='<strong>Administrator</strong><span>Unbegrenzt</span>';const form=document.getElementById('create'),type=form.elements.duration_type,custom=document.getElementById('custom');type.onchange=()=>custom.classList.toggle('hidden',type.value!=='custom');document.getElementById('search').oninput=render;form.onsubmit=async e=>{e.preventDefault();const payload={username:form.elements.username.value.trim(),password:form.elements.password.value,duration_type:type.value,expires_date:form.elements.expires_date.value};try{await api('admin/users',{method:'POST',body:JSON.stringify(payload)});form.reset();type.value='30';custom.classList.add('hidden');document.getElementById('status').textContent='Zugang gespeichert.';await load()}catch(x){document.getElementById('status').textContent=x.message}};await load()})().catch(e=>document.body.innerHTML='<p class="error">'+e.message+'</p>');</script></body></html>
